<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр партии</title>
    <link rel="stylesheet" href="/static/style.css">

<link rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
</head>
<body>

<div class="container">
    <div class="upload-section" style="margin-bottom: 20px;">
        <h1>Просмотр партии</h1>
        <p class="subtitle">
            <strong>{{ game.white_player }}</strong> — <strong>{{ game.black_player }}</strong>
        </p>
        <p class="subtitle">
            Результат: <strong>{{ game.result }}</strong>
            {% if game.opening_name %}
                | Дебют: <strong>{{ game.opening_name }}</strong>
            {% endif %}
        </p>

        <a href="/" class="btn-secondary" style="text-decoration: none; display: inline-block;">
            Назад в личный кабинет
        </a>
    </div>

    <div id="board-wrapper" style="position: relative; width: 420px; height: 420px; margin: 0 auto 20px auto;">
    <div id="board" style="width: 420px; height: 420px;"></div>
        <canvas id="arrowCanvas" width="840" height="840"
            style="position: absolute; top: 0; left: 0; width: 420px; height: 420px; pointer-events: auto; z-index: 10;">
        </canvas>
    </div>

        <p id="moveCounter" style="margin-bottom: 5px; font-weight: bold; text-align: center;">
            Ход 0
        </p>

        <p id="engineEval" style="margin-bottom: 15px; font-weight: bold; color: #d9534f; text-align: center;">
            Оценка движка: -
        </p>

        <div style="display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;">
            <button class="btn-secondary" onclick="goToStart()">В начало</button>
            <button class="btn-secondary" onclick="prevMove()">Назад</button>
            <button class="btn-secondary" onclick="nextMove()">Вперёд</button>
            <button class="btn-secondary" onclick="goToEnd()">В конец</button>
            <button class="btn-secondary" onclick="arrows=[]; arrowCtx.clearRect(0, 0, arrowCanvas.width, arrowCanvas.height);">Убрать стрелки</button>
        </div>
    </div>

    <div class="table-section">
        <h3>PGN партии</h3>
        <pre style="white-space: pre-wrap; font-family: Consolas, monospace; font-size: 13px;">{{ game.pgn_text }}</pre>
    </div>
</div>

<div id="pgn-data" data-pgn="{{ game.pgn_text | e }}" data-game-id="{{ game.id }}" style="display: none;"></div>

<script>
    const pgnContainer = document.getElementById("pgn-data");
    const pgnText = pgnContainer.dataset.pgn;
    const gameId = Number(pgnContainer.dataset.gameId);

    const chessGame = new Chess();
    chessGame.load_pgn(pgnText);

    const moves = chessGame.history();

    const replayGame = new Chess();

    const board = Chessboard('board', {
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
    });

    let currentMove = 0;

            async function fetchEvaluation(fen) {
        document.getElementById("engineEval").innerText = "Оценка движка: думаю...";
        try {
            const response = await fetch('/api/evaluate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fen: fen,
                    game_id: gameId,
                    move_number: currentMove
                })
            });
            const data = await response.json();
            document.getElementById("engineEval").innerText = "Оценка движка: " + data.score;
        } catch (error) {
            document.getElementById("engineEval").innerText = "Оценка движка: ошибка связи";
        }
    }

    function updateBoard() {
        replayGame.reset();

        for (let i = 0; i < currentMove; i++) {
            replayGame.move(moves[i]);
        }

        const currentFen = replayGame.fen();
        board.position(currentFen);
        
        document.getElementById("moveCounter").innerText =
            "Ход " + currentMove + " из " + moves.length;
            
        // Вызываем оценку движком
        fetchEvaluation(currentFen);
    }

    function nextMove() {
        if (currentMove < moves.length) {
            currentMove++;
            updateBoard();
        }
    }

    function prevMove() {
        if (currentMove > 0) {
            currentMove--;
            updateBoard();
        }
    }

    function goToStart() {
        currentMove = 0;
        updateBoard();
    }

    function goToEnd() {
        currentMove = moves.length;
        updateBoard();
    }

    // === СТРЕЛКИ НА ДОСКЕ ===
    const arrowCanvas = document.getElementById('arrowCanvas');
    const arrowCtx = arrowCanvas.getContext('2d');
    const canvasScale = 2;
    let arrows = [];
    let arrowStart = null;
    let arrowCurrentTarget = null;
    let isDrawingArrow = false;

    function getSquareFromXY(x, y) {
        const boardSize = 420;
        const squareSize = boardSize / 8;
        const col = Math.floor(x / squareSize);
        const row = Math.floor(y / squareSize);
        if (col < 0 || col > 7 || row < 0 || row > 7) return null;
        const files = 'abcdefgh';
        return files[col] + (8 - row);
    }

    function getSquareCenter(square) {
        const boardSize = 420 * canvasScale;
        const squareSize = boardSize / 8;
        const files = 'abcdefgh';
        const col = files.indexOf(square[0]);
        const row = 8 - parseInt(square[1]);
        return {
            x: col * squareSize + squareSize / 2,
            y: row * squareSize + squareSize / 2
        };
    }

    function drawSingleArrow(fromSq, toSq, color, alpha) {
        const from = getSquareCenter(fromSq);
        const to = getSquareCenter(toSq);

        const dx = to.x - from.x;
        const dy = to.y - from.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < 1) return;

        const angle = Math.atan2(dy, dx);
        const headLen = 30 * canvasScale;
        const lineWidth = 10 * canvasScale;

        const tipX = to.x;
        const tipY = to.y;
        const baseX = to.x - headLen * Math.cos(angle);
        const baseY = to.y - headLen * Math.sin(angle);

        arrowCtx.save();
        arrowCtx.globalAlpha = alpha;

        arrowCtx.strokeStyle = color;
        arrowCtx.lineWidth = lineWidth;
        arrowCtx.lineCap = 'round';
        arrowCtx.beginPath();
        arrowCtx.moveTo(from.x, from.y);
        arrowCtx.lineTo(baseX, baseY);
        arrowCtx.stroke();

        const headWidth = 18 * canvasScale;
        arrowCtx.fillStyle = color;
        arrowCtx.beginPath();
        arrowCtx.moveTo(tipX, tipY);
        arrowCtx.lineTo(
            baseX - headWidth * Math.cos(angle - Math.PI / 2),
            baseY - headWidth * Math.sin(angle - Math.PI / 2)
        );
        arrowCtx.lineTo(
            baseX - headWidth * Math.cos(angle + Math.PI / 2),
            baseY - headWidth * Math.sin(angle + Math.PI / 2)
        );
        arrowCtx.closePath();
        arrowCtx.fill();

        arrowCtx.restore();
    }

    function redrawAllArrows() {
        arrowCtx.clearRect(0, 0, arrowCanvas.width, arrowCanvas.height);
        for (const arr of arrows) {
            drawSingleArrow(arr.from, arr.to, '#15781b', 0.8);
        }
        if (isDrawingArrow && arrowStart && arrowCurrentTarget && arrowStart !== arrowCurrentTarget) {
            drawSingleArrow(arrowStart, arrowCurrentTarget, '#15781b', 0.5);
        }
    }

    arrowCanvas.addEventListener('mousedown', function(e) {
        const rect = arrowCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const sq = getSquareFromXY(x, y);
        if (sq) {
            arrowStart = sq;
            arrowCurrentTarget = sq;
            isDrawingArrow = true;
        }
    });

    arrowCanvas.addEventListener('mousemove', function(e) {
        if (!isDrawingArrow || !arrowStart) return;
        const rect = arrowCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const sq = getSquareFromXY(x, y);
        if (sq && sq !== arrowCurrentTarget) {
            arrowCurrentTarget = sq;
            redrawAllArrows();
        }
    });

    arrowCanvas.addEventListener('mouseup', function(e) {
        if (!isDrawingArrow || !arrowStart) return;
        const rect = arrowCanvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const sq = getSquareFromXY(x, y);
        if (sq && sq !== arrowStart) {
            const exists = arrows.findIndex(
                a => a.from === arrowStart && a.to === sq
            );
            if (exists >= 0) {
                arrows.splice(exists, 1);
            } else {
                arrows.push({ from: arrowStart, to: sq });
            }
        }
        arrowStart = null;
        arrowCurrentTarget = null;
        isDrawingArrow = false;
        redrawAllArrows();
    });

    arrowCanvas.addEventListener('dblclick', function() {
        arrows = [];
        arrowCtx.clearRect(0, 0, arrowCanvas.width, arrowCanvas.height);
    });
    updateBoard();
</script>

</body>
</html>
